services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: x90-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: x90
      POSTGRES_PASSWORD: x90_dev
      POSTGRES_DB: x90_portfolio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U x90 -d x90_portfolio
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: x90-portfolio-postgres-data
