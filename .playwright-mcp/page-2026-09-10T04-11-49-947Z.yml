          - generic [ref=f14e182]:
            - paragraph [ref=f14e183]: "Our current research centers on two interconnected pillars: long-context retrieval architectures and structured tool-using agent design. You can review our practical breakdown of retrieval pipelines at /research/building-long-context-rag, which covers semantic chunking, hybrid search, cross-encoder re-ranking, and strategies for consistently surfacing high-signal passages from large corpora."
            - paragraph [ref=f14e184]: We also publish ongoing work on agent orchestration at /research/designing-tool-agents. That piece maps memory, planning, tool execution, and reasoning into four discrete nodes, detailing how to wire them into stable execution graphs that handle retries, state transitions, and complex multi-step tasks.
            - paragraph [ref=f14e185]: Both research tracks are directly implemented in our shipped systems. The retrieval methodology powers our Domain RAG Pipeline (/projects/domain-rag-pipeline), while the agent graph patterns drive our Research Agent Runtime (/projects/research-agent-runtime). To validate performance across both, we maintain the Open Agent Eval Suite (/projects/open-agent-eval), an open-source harness that measures pass-rates, tool-call efficiency, and error recovery behavior.
            - paragraph [ref=f14e186]: "If you want to examine specific implementation choices, compare architectural trade-offs, or explore integration possibilities, please reach out through our contact form at #contact. Tell me which topic you’d like to dive into first, and I’ll point you to the relevant code, diagrams, or experimental notes."
