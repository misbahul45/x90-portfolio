        - article:
          - generic:
            - paragraph: Chunking, embedding, re-ranking — a practical pipeline for getting the right 5 passages out of 50,000 documents.
          - paragraph: Long-context retrieval is no longer a luxury. As context windows expand to 128k and beyond, the question shifts from how much we can fit to how reliably we can find what matters.
          - heading [level=2]: Why naive chunking breaks
          - paragraph: Naive fixed-size chunking loses structural cues. Tables, code blocks, and section boundaries all get sliced mid-thought. We need semantic chunking that respects the document topology.
          - list:
            - listitem:
              - paragraph: Use heading + paragraph boundaries as natural splits
            - listitem:
              - paragraph: Keep code blocks whole when semantically related
            - listitem:
              - paragraph: Preserve table row relationships when context allows
          - heading [level=2]: Embedding strategy
          - generic:
            - code: "from sentence_transformers import SentenceTransformer model = SentenceTransformer(\"BAAI/bge-large-en-v1.5\") def chunk_and_embed(text: str, chunk_size: int = 512): chunks = semantic_split(text, chunk_size) return model.encode(chunks, normalize_embeddings=True)"
          - blockquote:
            - paragraph: Re-ranking is non-optional at scale. Vector recall gives you 100 candidates; a cross-encoder trims that to the 5 that actually matter.
          - blockquote:
            - paragraph: The bottleneck is not generation. It is knowing which 5 of 10,000 documents to put in the context window.
          - paragraph: We tested three configurations on a 50k-document corpus. Re-ranking lifted nDCG@10 from 0.41 to 0.78 — almost double — for under 80ms additional latency.
